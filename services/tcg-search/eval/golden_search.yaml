# Golden set for search relevance (scripts/eval_search.py). Each query has
# graded judgments: 3 = the card the searcher means, 2 = also clearly right,
# 1 = acceptable. Unlisted results count as 0.
#
# Categories:
#   nav       the exact card name, typed normally
#   typo      a misspelled card name (zero results here is a gate failure)
#   accent    accents / punctuation / split-card names typed loosely
#   nickname  community nicknames (data/nicknames.yaml)
#   syntax    Scryfall-style filters; judged against the most-played cards that
#             satisfy the filter (relevance sort falls back to popularity)
#
# Ship gate (plan §7): name-finding success@1 (nav+typo+accent+nickname)
# >= 0.95, mean nDCG@10 >= 0.80, zero-result typos = 0.
#
# Every name here must exist in mtg_dev; the eval lists any that don't.


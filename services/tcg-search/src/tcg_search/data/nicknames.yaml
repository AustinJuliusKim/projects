# Community nicknames -> exact card names (front-face name is enough for
# multi-face cards). Indexed into the boosted `nicknames` keyword field, NOT
# as synonyms: "bolt" ranks Lightning Bolt first without hiding Bolt Bend.
# Matching is on the compacted form (lower-case, letters/digits only), so
# "power 9" = "power9" and "t3feri" = "T3Feri".
#
# Only add nicknames the community actually uses, and only exact Oracle
# names; `catalog build` warns about any name it can't find.


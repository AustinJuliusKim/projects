AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: TCG card-shop POS API (FastAPI + Mangum on Lambda behind HttpApi)

Parameters:
  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: Postgres connection string (Supabase transaction pooler, port 6543)
  MtgApiBase:
    Type: String
    Description: Base URL of services/mtg-api (catalog + prices), e.g. its HttpApi or CloudFront origin, no trailing slash

Globals:
  Function:
    Timeout: 10
    MemorySize: 512 # CPU scales with memory; keeps FastAPI cold starts ~1s

Resources:
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: tcg-pos-api
      Runtime: python3.12
      Handler: tcg_pos_api.lambda_handler.handler
      CodeUri: src/
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          MTG_API_BASE: !Ref MtgApiBase
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Description: tcg-pos-api gateway (no auth yet — do not deploy before the auth claim replaces X-Tenant-Id)

  # Explicit log group so retention is bounded (cost control) instead of the
  # Lambda-created never-expiring default.
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/tcg-pos-api
      RetentionInDays: 30

Outputs:
  ApiEndpoint:
    Description: HttpApi endpoint
    Value: !Sub "${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"

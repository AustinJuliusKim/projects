# Local Postgres for development and the integration tests. Plain postgres:16
# (no extensions needed). Port 54330 so it can run beside mtg-api's :54329.
#   docker compose up -d
#   DATABASE_URL=postgres://postgres:postgres@localhost:54330/postgres python scripts/migrate.py
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "54330:5432"

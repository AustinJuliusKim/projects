# Bootstrap complete as of 2026-08-05 (see the vault's Choices CloudFront
# PAYG Migration Plan doc, Disposition log). CertificateArn above is the new
# dual-SAN cert (arn:...dce0cb12-7e2a-43a7-9952-e8252af9545e, covers both
# choices.austinjuliuskim.com and preview.choices.austinjuliuskim.com);
# PreviewEdgeFunctionArn points at ops/edge-preview-router.yaml's
# ChoicesPreviewEdgeRouter stack (us-east-1) -- re-paste after every future
# redeploy of that stack, Lambda@Edge requires a newly published version
# per code change.

# Preview stack for feature branches (docs/feature-deploys.md). Fully separate
# backend resources: own table, bucket, Lambda; no distribution of its own
# (CreateDistribution=false) -- reached at preview.choices.austinjuliuskim.com,
# served by prod's shared distribution via the Lambda@Edge router in
# ops/edge-preview-router.yaml. VAPID keys are a dedicated preview-only pair —
# never used by prod. The PRIVATE key is deliberately not committed (public
# repo): pass it via --parameter-overrides on first stack creation; updates
# reuse the stored value (same as prod). OriginVerifySecret similarly must be
# set once out-of-band (see docs/feature-deploys.md) -- it gates both the API
# origin's x-origin-verify header and the S3 bucket's Referer-based policy.
[preview.deploy.parameters]
stack_name = "ChoicesWebApp-preview"
resolve_s3 = true
s3_prefix = "ChoicesWebApp-preview"
confirm_changeset = false
capabilities = "CAPABILITY_IAM"

AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Portfolio: static site (Vite build) served via private S3 + CloudFront (OAC, SPA fallback).
  No backend — plain CloudFormation (not SAM). Mirrors apps/guided-repl/template.yaml.

Parameters:
  CustomDomain:
    Type: String
    Default: ""
    Description: Optional custom domain for the site, e.g. austinjuliuskim.com (leave blank to use the CloudFront URL)
  CertificateArn:
    Type: String
    Default: ""
    Description: ACM certificate ARN in us-east-1 for CustomDomain (required if CustomDomain is set)
  IncludeWww:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Add www.<CustomDomain> as an alias and 301-redirect it to the apex.
      Requires the ACM cert to cover BOTH the apex and the www name.

Conditions:
  HasCustomDomain: !Not [!Equals [!Ref CustomDomain, ""]]
  HasWww: !And
    - !Condition HasCustomDomain
    - !Equals [!Ref IncludeWww, "true"]

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # One viewer-request function, because CloudFront allows only one per behavior.
  # It does two things: the www->apex redirect (when IncludeWww), and rewriting
  # extensionless URIs to /<path>/index.html so prerendered blog pages are served
  # with their own <title>/OG tags instead of falling through to the SPA shell.
  # S3 is a REST origin, so it will not resolve directory indexes on its own.
  ViewerRequestFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-viewer-request"
      AutoPublish: true
      FunctionConfig:
        Comment: Rewrite extensionless URIs to /index.html; redirect www to apex
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub
        - |
          function handler(event) {
            var request = event.request;
            ${WwwRedirect}
            var uri = request.uri;
            if (uri.endsWith('/')) {
              request.uri = uri + 'index.html';
            } else if (uri.split('/').pop().indexOf('.') === -1) {
              // Extensionless path: try a prerendered page. Missing keys 403 and
              // fall through to the SPA shell via CustomErrorResponses, so
              // client-only routes keep working unchanged.
              request.uri = uri + '/index.html';
            }
            return request;
          }
        - WwwRedirect: !If
            - HasWww
            - |-
              var host = request.headers.host.value;
              if (host.startsWith('www.')) {
                  var apex = host.substring(4);
                  return {
                    statusCode: 301,
                    statusDescription: 'Moved Permanently',
                    headers: { location: { value: 'https://' + apex + request.uri } }
                  };
                }
            - ""

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Aliases: !If
          - HasWww
          - [!Ref CustomDomain, !Sub "www.${CustomDomain}"]
          - !If [HasCustomDomain, [!Ref CustomDomain], !Ref "AWS::NoValue"]
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: SiteS3Origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: SiteS3Origin
          ViewerProtocolPolicy: redirect-to-https
          # AWS managed "CachingOptimized" policy
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          AllowedMethods: [GET, HEAD, OPTIONS]
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt ViewerRequestFunction.FunctionARN
        CustomErrorResponses:
          # SPA fallback: serve index.html for client-side routes (e.g. /resume)
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution.Id}"

Outputs:
  SiteBucketName:
    Description: S3 bucket to upload the built frontend (aws s3 sync dist/)
    Value: !Ref SiteBucket
  DistributionId:
    Description: CloudFront distribution ID (for cache invalidations)
    Value: !Ref SiteDistribution
  DistributionDomainName:
    Description: CloudFront domain to point your DNS alias at
    Value: !GetAtt SiteDistribution.DomainName
  SiteUrl:
    Description: Your portfolio URL (open this!)
    Value: !If
      - HasCustomDomain
      - !Sub "https://${CustomDomain}"
      - !Sub "https://${SiteDistribution.DomainName}"

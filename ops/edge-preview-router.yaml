AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Lambda@Edge origin-request router for choices-webapp: associated on the
  prod distribution (apps/choices-webapp/template.yaml), it routes requests
  whose Host header matches the preview subdomain to the preview stack's own
  origins (S3 bucket, Lambda Function URL); every other Host passes through
  unchanged. Admin-deployed, us-east-1 -- Lambda@Edge functions must be
  authored/published there regardless of where the distribution or the rest
  of this app's resources live (same reason ops/edge-waf.yaml is us-east-1).

# ---------------------------------------------------------------------------
# Why this function's code is duplicated (see ops/edge-preview-router/router.mjs
# for the tested, canonical copy of the routing logic; this template's
# InlineCode below is a hand-synced copy of the same logic with config baked
# in via Fn::Sub):
#
# Lambda@Edge functions cannot use environment variables at all (AWS docs,
# "Restrictions on Lambda@Edge" -> "Lambda features"). CloudFormation can
# only template deploy-time parameter values into an *inline* Code property
# (Fn::Sub over InlineCode/ZipFile) -- it has no mechanism to substitute
# values into a CodeUri-zipped directory's file contents, since that zip is
# built and uploaded before CloudFormation ever resolves a parameter. Since
# PreviewOriginVerifySecret must never be committed to this public repo (same
# handling as VapidPrivateKey/OriginVerifySecret elsewhere in this app --
# NoEcho, passed once via --parameter-overrides, retained on later deploys),
# InlineCode + Fn::Sub is the only option, which forces a real, testable
# CodeUri-based file out of the deployment path. Keep both copies in sync on
# any logic change.
#
# ---------------------------------------------------------------------------
# BOOTSTRAP ORDER (see apps/choices-webapp/docs/feature-deploys.md for the
# full rollout, this is the summary relevant to this stack):
#
# 1. Deploy apps/choices-webapp/template.yaml to ChoicesWebApp-preview with
#    CreateDistribution=false and a real OriginVerifySecret (generate with
#    `openssl rand -hex 32`, record it somewhere durable -- NoEcho params
#    aren't recoverable via describe-stacks).
# 2. Read that stack's SiteBucketName and ApiUrl outputs; derive:
#      PreviewSiteBucketDomain = <SiteBucketName>.s3.<region>.amazonaws.com
#      PreviewApiOriginDomain  = the ApiUrl host only (strip https:// and any
#        trailing path/slash -- same parsing template.yaml already does with
#        !Select [2, !Split ["/", ...]])
# 3. Deploy THIS stack (us-east-1) with those two values,
#    PreviewAliasHostname (must match the preview stack's own CustomDomain
#    and prod's PreviewAliasHostname parameter exactly), and the same
#    OriginVerifySecret from step 1.
# 4. Copy this stack's PreviewEdgeRouterVersionArn output into prod's
#    (apps/choices-webapp, config-env default) PreviewEdgeFunctionArn
#    parameter and redeploy prod. This is the moment the preview subdomain
#    goes live.
# 5. On any FUTURE change to this function's code: bump the version by
#    redeploying this stack, then repeat step 4 (re-copy the new ARN into
#    prod and redeploy it) -- Lambda@Edge requires a newly published Version
#    per code change; CloudFront rejects $LATEST and alias ARNs.
# ---------------------------------------------------------------------------

Parameters:
  PreviewAliasHostname:
    Type: String
    Description: >
      e.g. preview.choices.austinjuliuskim.com. Must match prod's
      PreviewAliasHostname (apps/choices-webapp/template.yaml) and the
      preview stack's own CustomDomain exactly.
  PreviewSiteBucketDomain:
    Type: String
    Description: >
      Preview stack's SiteBucket regional REST domain (its SiteBucketName
      output + .s3.<region>.amazonaws.com). Stable across ordinary preview
      deploys -- only changes if the bucket is ever replaced (rare; SAM
      keeps the same physical bucket across in-place updates).
  PreviewApiOriginDomain:
    Type: String
    Description: >
      Preview stack's Lambda Function URL domain only -- no scheme, no
      trailing slash (e.g. abcd1234.lambda-url.us-west-2.on.aws). Derive
      from the preview stack's ApiUrl output.
  PreviewOriginVerifySecret:
    Type: String
    NoEcho: true
    Description: >
      Preview stack's OriginVerifySecret value (same secret set on
      ChoicesWebApp-preview). Sent as x-origin-verify to preview's Function
      URL (existing pattern) and as Referer to preview's S3 bucket (see
      apps/choices-webapp/template.yaml's PreviewSiteBucketPolicy for why
      Referer, not OAC/OAI, gates the S3 side). Like VapidPrivateKey
      elsewhere in this app: pass once via --parameter-overrides, never
      commit; later deploys of this stack reuse the stored value.

Resources:
  EdgeRouterExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              # Both are required for Lambda@Edge (AWS docs, "Lambda role
              # permissions") -- lambda.amazonaws.com for the function
              # itself, edgelambda.amazonaws.com for CloudFront's
              # replication-to-edge-locations process.
              Service: [lambda.amazonaws.com, edgelambda.amazonaws.com]
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  # No explicit AWS::Lambda::Permission for edgelambda.amazonaws.com to
  # invoke this function: CloudFront's association step (LambdaFunctionAssociations
  # on the distribution) handles this internally as part of Lambda@Edge
  # replication, unlike e.g. S3 event notifications. Confirm on first deploy
  # -- if wrong, the distribution update itself will surface a clear
  # permission error, not a silent failure.
  PreviewEdgeRouterFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      # Lambda@Edge forbids arm64 and disallows most Lambda features (layers,
      # VPC, DLQ, X-Ray, provisioned concurrency, env vars) -- none of which
      # this function needs anyway. Runtime: verify against the current
      # Lambda@Edge-supported list at deploy time (it has historically lagged
      # regular Lambda's; nodejs22.x is a conservative choice as of this
      # writing -- bump if a newer one is confirmed supported).
      Runtime: nodejs22.x
      Architectures: [x86_64]
      MemorySize: 128
      Timeout: 5
      Role: !GetAtt EdgeRouterExecutionRole.Arn
      AutoPublishAlias: live
      # Hand-synced copy of ops/edge-preview-router/router.mjs's routeRequest
      # logic -- see the file header comment above for why this can't be a
      # CodeUri reference to that file instead. CommonJS (not the repo's
      # usual .mjs/ESM convention): Lambda's inline-code packaging has no
      # package.json to declare "type": "module", so it resolves as classic
      # CommonJS.
      InlineCode: !Sub
        - |
          'use strict';
          var PREVIEW_HOST = "${PreviewHost}";
          var API_DOMAIN = "${ApiDomain}";
          var API_SECRET = "${ApiSecret}";
          var S3_DOMAIN = "${S3Domain}";
          var S3_SECRET = "${S3Secret}";

          exports.handler = function (event, context, callback) {
            var request = event.Records[0].cf.request;
            var hostHeader = request.headers.host && request.headers.host[0] && request.headers.host[0].value;
            if (hostHeader !== PREVIEW_HOST) {
              callback(null, request);
              return;
            }
            var isApi = request.uri.indexOf("/api") === 0 || request.uri.indexOf("/j/") === 0;
            if (isApi) {
              request.origin = {
                custom: {
                  domainName: API_DOMAIN,
                  port: 443,
                  protocol: "https",
                  path: "",
                  sslProtocols: ["TLSv1.2"],
                  readTimeout: 30,
                  keepaliveTimeout: 5,
                  customHeaders: API_SECRET
                    ? { "x-origin-verify": [{ key: "x-origin-verify", value: API_SECRET }] }
                    : {}
                }
              };
              request.headers.host = [{ key: "host", value: API_DOMAIN }];
              callback(null, request);
              return;
            }
            request.uri = request.uri.replace(/^\/__preview/, "") || "/";
            request.origin = {
              custom: {
                domainName: S3_DOMAIN,
                port: 443,
                protocol: "https",
                path: "",
                sslProtocols: ["TLSv1.2"],
                readTimeout: 30,
                keepaliveTimeout: 5,
                customHeaders: S3_SECRET
                  ? { referer: [{ key: "Referer", value: S3_SECRET }] }
                  : {}
              }
            };
            request.headers.host = [{ key: "host", value: S3_DOMAIN }];
            callback(null, request);
          };
        - PreviewHost: !Ref PreviewAliasHostname
          ApiDomain: !Ref PreviewApiOriginDomain
          ApiSecret: !Ref PreviewOriginVerifySecret
          S3Domain: !Ref PreviewSiteBucketDomain
          S3Secret: !Ref PreviewOriginVerifySecret

Outputs:
  PreviewEdgeRouterVersionArn:
    Description: >
      Published Version ARN -- paste into apps/choices-webapp's
      PreviewEdgeFunctionArn parameter (config-env default/prod) and
      redeploy prod. Re-copy after every future deploy of this stack.
    Value: !Ref PreviewEdgeRouterFunction.Version

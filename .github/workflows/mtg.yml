name: mtg CI

on:
  push:
    branches: [main]
    paths:
      - "services/mtg-api/**"
      - ".github/workflows/mtg.yml"
  pull_request:
    paths:
      - "services/mtg-api/**"
      - ".github/workflows/mtg.yml"

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/mtg-api
    services:
      # pgvector image so 0001_extensions.sql (vector extension) applies.
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/mtg-api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python scripts/migrate.py --dry-run
      - run: pytest
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:54329/postgres

  deploy:
    # Gated on a repo variable so main stays green until the one-time ops
    # setup exists (IAM role + first manual sam deploy — see
    # services/mtg-api/README.md). Set MTG_DEPLOY_ENABLED=true to arm.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.MTG_DEPLOY_ENABLED == 'true'
    needs: [api]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # for OIDC role assumption
      contents: read
    concurrency:
      group: mtg-api-deploy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: services/mtg-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/mtg-api/requirements-dev.txt
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::549883968767:role/mtg-api-github-deploy
          aws-region: us-west-2
      - run: pip install -r requirements-dev.txt
      # Schema before code: the new Lambda build may depend on new columns.
      - name: Apply migrations
        run: python scripts/migrate.py
        env:
          DATABASE_URL: ${{ secrets.MTG_DATABASE_URL }}
      # ubuntu-latest runners ship the AWS SAM CLI preinstalled.
      - run: sam build
      # samconfig.toml is gitignored repo-wide, so every flag is explicit.
      # No --parameter-overrides on purpose: the secret DatabaseUrl parameter
      # is already set on the live stack, and sam deploy marks any template
      # parameter it isn't given as UsePreviousValue=true on the update
      # changeset, so CloudFormation reuses the stack's current value. This
      # only works because the stack already exists — a from-scratch CREATE
      # must be done manually with full --parameter-overrides (see
      # services/mtg-api/README.md).
      - name: sam deploy
        run: |
          sam deploy \
            --stack-name MtgApi \
            --region us-west-2 \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

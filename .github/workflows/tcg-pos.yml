name: tcg-pos CI

on:
  push:
    branches: [main]
    paths:
      - "services/tcg-pos-api/**"
      - "apps/tcg-pos/**"
      - ".github/workflows/tcg-pos.yml"
  pull_request:
    paths:
      - "services/tcg-pos-api/**"
      - "apps/tcg-pos/**"
      - ".github/workflows/tcg-pos.yml"

# Test-only: no deploy jobs until the API has real auth (see
# services/tcg-pos-api/OPS.md).
jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/tcg-pos-api
    services:
      # Plain postgres:16 — the schema needs no extensions. Runs as a
      # superuser; the tests drop to the tcg_pos_app role so RLS applies.
      db:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54330:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/tcg-pos-api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python scripts/migrate.py --dry-run
      - run: pytest
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:54330/postgres

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tcg-pos
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15
          cache: npm
          cache-dependency-path: apps/tcg-pos/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
